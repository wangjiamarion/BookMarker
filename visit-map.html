        `<b>Item #${site.item}</b><br>` +
        `<b>${site.address}</b><br>` +
        `Use: ${site.use}<br>` +
        `Look URM: ${site.lookURM}` +
        notesHtml +
        `</div>`
      );
      markers.push(marker);
    });

    // Fit map to show all markers
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.15));
